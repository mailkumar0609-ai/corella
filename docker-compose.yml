# Local production-like stack: Postgres + API + worker.
#   cp .env.example .env   (fill in keys)
#   docker compose up --build
#   docker compose run --rm api corella admin create-org "My Company" --plan growth
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: corella
      POSTGRES_PASSWORD: corella
      POSTGRES_DB: corella
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corella"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://corella:corella@db:5432/corella
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: .
    command: ["corella", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://corella:corella@db:5432/corella
    depends_on: { db: { condition: service_healthy } }
    deploy: { replicas: 2 }

volumes:
  pgdata:
